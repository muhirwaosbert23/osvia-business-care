name: osvia-business-care

services:
  portal:
    build: .
    image: osvia-business-care:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - portal-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  meshcentral:
    profiles: ["meshcentral"]
    image: ghcr.io/ylianst/meshcentral:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - mesh-data:/opt/meshcentral/meshcentral-data
      - mesh-files:/opt/meshcentral/meshcentral-files
      - mesh-backups:/opt/meshcentral/meshcentral-backups
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

volumes:
  portal-data:
  mesh-data:
  mesh-files:
  mesh-backups:
